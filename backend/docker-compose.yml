version: "3.9"

# Local dev with SQLite (no Postgres needed). The backend container
# mounts the current folder so patienttriage.db persists between runs.
services:
  backend:
    build: .
    container_name: patienttriage_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./patienttriage.db
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
      LOG_LEVEL: INFO
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# Want Postgres later instead? Swap DATABASE_URL to:
#   postgresql+psycopg://triage:triage@postgres:5432/patienttriage
# and add a postgres service (see README for the snippet).
